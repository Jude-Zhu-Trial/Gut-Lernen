name: Build firmware

on:
  push:
    tags:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Synthesize word audio (Piper TTS)
        run: |
          pip install piper-tts
          mkdir -p voices
          curl -sL --retry 3 -o voices/de.onnx \
            https://huggingface.co/rhasspy/piper-voices/resolve/main/de/de_DE/thorsten/high/de_DE-thorsten-high.onnx
          curl -sL --retry 3 -o voices/de.onnx.json \
            https://huggingface.co/rhasspy/piper-voices/resolve/main/de/de_DE/thorsten/high/de_DE-thorsten-high.onnx.json
          python3 firmware/tools/gen_audio.py --voice voices/de.onnx

      - name: Build firmware (ESP-IDF 5.5.3 / esp32c3)
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          esp_idf_version: v5.5.3
          target: esp32c3
          command: >-
            cd firmware &&
            SDKCONFIG_DEFAULTS=sdkconfig.defaults idf.py build &&
            idf.py merge-bin -o FoloToy-AI-Passport-full.bin

      - name: Upload firmware artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gut-lernen-firmware
          path: firmware/build/FoloToy-AI-Passport-full.bin
          if-no-files-found: error
